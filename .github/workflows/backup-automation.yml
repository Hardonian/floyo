name: Automated Daily Backups

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Mon 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup:
    name: Create Database Backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.S3_BACKUP_BUCKET != '' }}
      HAS_BACKUP_WEBHOOK: ${{ secrets.BACKUP_WEBHOOK_URL != '' }}
      HAS_SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY != '' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create Backup
        run: |
          DB_HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")
          if ! getent hosts "$DB_HOST" >/dev/null 2>&1; then
            echo "::notice::DATABASE_URL host '$DB_HOST' does not resolve (stale or paused database) - backup skipped; rotate the DATABASE_URL secret to re-enable"
            echo "Backup skipped: database host $DB_HOST unreachable" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_SNAPSHOT_KEY" = "true" ]; then
            npm run ops:snapshot -- --encrypt
          else
            echo "::notice::SNAPSHOT_ENCRYPTION_KEY not set - creating an unencrypted local snapshot"
            npm run ops:snapshot
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_ENCRYPTION_KEY: ${{ secrets.SNAPSHOT_ENCRYPTION_KEY }}
      
      - name: Upload Backup to S3 (if configured)
        if: env.HAS_AWS == 'true'
        run: |
          # Upload encrypted backup to S3
          aws s3 cp ops/snapshots/*.encrypted s3://${{ secrets.S3_BACKUP_BUCKET }}/backups/ --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: S3 upload skipped notice
        if: env.HAS_AWS != 'true'
        run: echo "::notice::AWS_ACCESS_KEY_ID/S3_BACKUP_BUCKET not configured - skipping S3 backup upload"
      
      - name: Cleanup Old Backups
        run: |
          # Keep only last 7 days of backups locally
          if [ -d ops/snapshots ]; then
            find ops/snapshots -name "*.encrypted" -mtime +7 -delete
            find ops/snapshots -name "*.metadata.json" -mtime +7 -delete
          else
            echo "::notice::ops/snapshots does not exist (backup skipped) - nothing to clean up"
          fi
      
      - name: Notify on Failure
        if: failure() && env.HAS_BACKUP_WEBHOOK == 'true'
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.BACKUP_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          text: 'Daily backup failed - manual intervention required'
