name: Nightly ETL
on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Mon 06:00 UTC
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Check optional ad-platform tokens
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_PASSWORD: ${{ secrets.SHOPIFY_PASSWORD }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        run: |
          for v in META_TOKEN TIKTOK_TOKEN SHOPIFY_API_KEY SHOPIFY_PASSWORD SHOPIFY_STORE; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v not configured - ad-platform pull steps are disabled"
            fi
          done
      - name: Run ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_PASSWORD: ${{ secrets.SHOPIFY_PASSWORD }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          TZ: America/Toronto
        run: |
          if [ -n "$DATABASE_URL" ]; then
            DB_HOST=$(node -e "console.log(new URL(process.env.DATABASE_URL).hostname)")
            if ! getent hosts "$DB_HOST" >/dev/null 2>&1; then
              echo "::notice::DATABASE_URL host '$DB_HOST' does not resolve (stale or paused database) - ETL skipped; rotate the DATABASE_URL secret to re-enable"
              exit 0
            fi
          else
            echo "::notice::DATABASE_URL not set - ETL skipped (set it to enable)"
            exit 0
          fi
          npx tsx scripts/etl/compute_metrics.ts --cron
