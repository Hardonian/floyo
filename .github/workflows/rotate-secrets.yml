name: Rotate Secrets

on:
  # Secret rotation mutates external providers and therefore runs only by explicit dispatch.
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rotation of all secrets'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  rotate-secrets:
    name: Rotate Secrets
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Rotate secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm run ops:rotate-secrets -- --dry-run || echo "Dry run completed"
          
          # Only actually rotate if not dry-run and approved
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            npm run ops:rotate-secrets || exit 1
          else
            echo "Scheduled rotation skipped (use workflow_dispatch to actually rotate)"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Secrets rotation failed';
            const body = 'Manual secrets rotation failed. Review the workflow run and rotate through the approved provider path.';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automation',
              per_page: 100
            });
            const existing = openIssues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another manual rotation attempt failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'automation']
              });
            }
