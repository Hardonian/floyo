name: Post-Deploy Verify (Supabase & DQ)
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    env:
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || true
      - name: SUPABASE_DB_URL check
        if: env.HAS_SUPABASE_DB_URL != 'true'
        run: echo "::notice::SUPABASE_DB_URL secret not configured - skipping post-deploy verification (set it to enable)"
      - name: Post Deploy Verify
        if: env.HAS_SUPABASE_DB_URL == 'true'
        env:
          TZ: America/Toronto
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: npx tsx scripts/agents/post_deploy_verify.ts
      - name: Write status.json
        if: always()
        env:
          TZ: America/Toronto
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: npx tsx scripts/agents/write_status_json.ts || true
