name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install & Test
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install pytest pytest-asyncio
          pytest tests/ -x -q 2>/dev/null || echo "No tests yet"

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      HAS_CF: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Cloudflare credentials check
        if: env.HAS_CF != 'true'
        run: echo "::notice::CF_API_TOKEN/CF_ACCOUNT_ID not configured - skipping Cloudflare Workers deploy (set them to enable)"

      - name: Create D1 database (idempotent)
        if: env.HAS_CF == 'true'
        continue-on-error: true
        working-directory: deploy/workers
        run: wrangler d1 create drift_db || true

      - name: Apply D1 schema
        if: env.HAS_CF == 'true'
        continue-on-error: true
        working-directory: deploy/workers
        run: |
          DB_ID=$(wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; dbs=json.load(sys.stdin); print([d['id'] for d in dbs if d.get('name')=='drift_db'][0])" 2>/dev/null || echo "")
          if [ -n "$DB_ID" ]; then
            wrangler d1 execute drift_db --remote --file=../d1/schema.sql
            # Update wrangler.toml with the real DB_ID
            sed -i "s/database_id = \"placeholder-id\"/database_id = \"$DB_ID\"/" wrangler.toml
          fi

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF == 'true'
        working-directory: deploy/workers
        run: wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          sleep 5
          curl -s https://${{ vars.DOMAIN }}/health | python3 -m json.tool || echo "Health check skipped"

  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      HAS_CF: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cloudflare credentials check
        if: env.HAS_CF != 'true'
        run: echo "::notice::CF_API_TOKEN/CF_ACCOUNT_ID not configured - skipping Cloudflare Pages deploy (set them to enable)"

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        run: |
          npm install -g wrangler
          # wrangler pages deploy never creates projects; create once (idempotent)
          wrangler pages project create "${{ github.event.repository.name }}" --production-branch main || true
          wrangler pages deploy deploy/frontend --project-name "${{ github.event.repository.name }}" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}